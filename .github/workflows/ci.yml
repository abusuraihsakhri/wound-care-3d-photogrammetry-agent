name: CI

on:
  push:
    branches: [master, main, audit-466-reliability-browser]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install and check package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest httpx build
          python -m pip check
      - name: Python tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q agents wound_vision_ai cli.py enrichment.py simulator.py
      - name: Browser demo checks
        run: |
          node --check web/app.js
          node --test tests/test_browser_demo.cjs
      - name: Validate package build
        if: matrix.python-version == '3.12'
        run: python -m build
