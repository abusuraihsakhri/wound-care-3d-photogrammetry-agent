[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wound-care-3d-photogrammetry-engine"
version = "2.0.0"
description = "WoundVision-AI: 3D Tissue Surface & PUSH Ulcer Healing Score Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
wound-care-3d-photogrammetry-engine = "wound_vision_ai.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/wound-care-3d-photogrammetry-agent"
Repository = "https://github.com/abusuraihsakhri/wound-care-3d-photogrammetry-agent"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "wound_vision_ai_app"]

[tool.setuptools.packages.find]
include = ["agents*", "wound_vision_ai*"]
